<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI_5_11 — Чтение «Экскурсия по Москве»</title>
  <link rel="stylesheet" href="../../lesson7/excursion.css">
</head>
<body>
  <header>
    <div class="tag"># ЧТЕНИЕ · УРОК 5 · AI_5_11</div>
    <h1>Экскурсия по Москве</h1>
    <p>Прослушайте текст и повторите его за диктором. Затем запишите чтение всего текста.
      Лимит — 3 минуты. Зачёт — от 60 баллов.</p>
  </header>
  <main>
    <article class="card">
      <div class="toolbar" aria-label="Запись чтения">
        <button id="record" type="button">Начать запись</button>
        <button id="stop" type="button" disabled>Остановить</button>
        <button id="check" type="button" disabled>Проверить</button>
        <strong id="timer">0:00 / 3:00</strong>
      </div>
      <audio id="player" controls hidden aria-label="Ваша запись"></audio>
      <p id="status" role="status">Готово к записи</p>
      <audio id="narration" controls preload="none" src="reference.mp3" aria-label="Диктор читает весь текст"></audio>
      <div id="source" class="source"></div>
    </article>
    <aside class="card">
      <h2>Результат</h2>
      <div id="result" class="result" aria-live="polite">—</div>
      <img src="illustration.png" alt="Экскурсовод и два друга у Московского Кремля"
        width="732" height="650" style="display: block; max-width: 100%; height: auto; margin-top: 1rem;">
    </aside>
  </main>
  <script src="../../api-config.js"></script>
  <script src="../../lesson7/faculty.js"></script>
  <script>
    const API = window.ANALYZER_CONFIG.apiBaseUrl;
    const TASK_ID = "lesson5_moscow_excursion_reading";
    const TASK_CODE = "AI_5_11";
    const MAX_SECONDS = 180;
    const narration = document.getElementById("narration");
    const recordButton = document.getElementById("record");
    const stopButton = document.getElementById("stop");

    narration.addEventListener("play", () => {
      if (!stopButton.disabled) narration.pause();
    });
    recordButton.addEventListener("click", () => narration.pause());

    async function loadText() {
      const response = await fetch("source.json");
      if (!response.ok) throw new Error("Не удалось загрузить текст.");
      return response.json();
    }
  </script>
  <script src="../reading.js"></script>
</body>
</html>
